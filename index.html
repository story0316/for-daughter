<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>게임 모음</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <div class="hub-header">
      <span class="hub-badge">🎮 게임 고르기</span>
      <p class="hub-hint">옆으로 밀어서 골라보세요</p>
    </div>

    <div id="carousel" class="carousel">
      <div id="track" class="track"></div>

      <button id="arrow-left" class="nav-arrow nav-arrow-left" aria-label="이전 게임">‹</button>
      <button id="arrow-right" class="nav-arrow nav-arrow-right" aria-label="다음 게임">›</button>

      <div id="dots" class="dots"></div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
